services:
  strtchy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strtchy
    restart: unless-stopped
    ports:
      - "4173:4173"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/static/uploads
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=/app/data/prod/local.db # Ruta absoluta corregida (sin el punto)
      - PORT=4173
      - HOST=0.0.0.0
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=host
    working_dir: /app

  litestream:
    image: litestream/litestream:0.3
    container_name: strtchy-litestream
    profiles: ["backup"]
    restart: unless-stopped
    command: replicate
    volumes:
      - ./data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    env_file:
      - .env.production
    environment:
      - LITESTREAM_B2_BUCKET=${LITESTREAM_B2_BUCKET:-}
      - LITESTREAM_B2_ENDPOINT=${LITESTREAM_B2_ENDPOINT:-}
      - LITESTREAM_B2_ACCESS_KEY_ID=${LITESTREAM_B2_ACCESS_KEY_ID:-}
      - LITESTREAM_B2_SECRET_ACCESS_KEY=${LITESTREAM_B2_SECRET_ACCESS_KEY:-}
    depends_on:
      - strtchy
