services:
  strtchy:
    image: ghcr.io/cazdlt/strtchy:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strtchy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/static/uploads
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=/app/data/prod/local.db
      - PORT=4173
      - HOST=0.0.0.0
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=host
    working_dir: /app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: strtchy-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    env_file:
      - .env.production
    command: tunnel --no-autoupdate run
    depends_on:
      - strtchy

  litestream:
    image: litestream/litestream:0.3
    container_name: strtchy-litestream
    profiles: ["backup"]
    restart: unless-stopped
    command: replicate
    volumes:
      - ./data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    env_file:
      - .env.production
    depends_on:
      - strtchy
